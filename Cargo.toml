[package]
name = "rsbsky"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.34"
humantime = "2.4.0"
ratatui = "0.30.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
unicode-width = "0.2.3"

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"

[package]
name = "rsbsky"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"

[features]
# Optional Pydantic Logfire export, active at run time only when LOGFIRE_TOKEN is set.
# `--no-default-features` builds without the OpenTelemetry stack.
default = ["logfire"]
logfire = ["dep:logfire", "dep:opentelemetry"]

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.34"
humantime = "2.4.0"
logfire = { version = "0.13.1", optional = true }
opentelemetry = { version = "0.32.0", optional = true, default-features = false, features = ["metrics"] }
ratatui = "0.30.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
tracing = "0.1.44"
unicode-width = "0.2.3"

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
